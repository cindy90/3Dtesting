name: 3D blind test

# Manual trigger only — real generations cost credits, so nothing runs on push.
# Set inputs when dispatching to control scope and cost.
on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Providers (subset of: tripo tripo_h31 tripo_p1d tripo_fal tripo_p1 meshy rodin rodin_fal seed3d hunyuan3d hunyuan3d_v21 hunyuan3d_v31 trellis trellis2 triposr instantmesh)"
        required: true
        default: "tripo"
      mode:
        description: "text = text-native only (tripo/meshy) | image = shared reference image, required for open-source models"
        required: true
        default: "text"
        type: choice
        options: ["text", "image"]
      max_cases:
        description: "Cost cap: max number of cases (sampled across categories). Start SMALL."
        required: true
        default: "2"
      repeats:
        description: "Generations per case per provider (2-3 for publication runs; multiplies cost!)"
        required: true
        default: "1"

# Serialize only runs that target the SAME providers (that's the real
# double-spend risk: dispatching an identical batch twice). Distinct provider
# sets get distinct groups and run in parallel — a publication round is three
# provider batches, and forcing them serial (or, worse, letting a third
# dispatch cancel a pending one) just wastes wall-clock.
concurrency:
  group: blindtest-${{ github.event.inputs.providers }}
  cancel-in-progress: false

jobs:
  blindtest:
    runs-on: ubuntu-latest
    # publication rounds run 40 cases x N repeats per provider group; generation
    # is poll-bound and analysis is per-mesh, so give the job real headroom
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # optional fast ray backend — massively speeds the interior-face probe
          # on dense meshes. Non-fatal: analysis falls back to pure-python + a
          # time-box if the wheel isn't available for the runner.
          pip install embreex || echo "embreex unavailable; using pure-python ray backend"
          # Blender headless module for the rig smoke test (non-fatal; ~300MB, pip-cached)
          pip install bpy || echo "bpy unavailable; rig smoke test will be skipped"

      - name: Install PrusaSlicer (slicer ground truth; non-fatal)
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y prusa-slicer \
            || echo "prusa-slicer unavailable; slicer ground truth will be skipped"

      - name: Self-test (no keys, proves the analysis pipeline before spending)
        run: python -m src.selftest

      - name: Reference images (image mode only)
        if: ${{ github.event.inputs.mode == 'image' }}
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          # on failure, run the zero-cost fal diagnostics so the logs explain why
          python -m src.cli refimg --max-cases ${{ github.event.inputs.max_cases }} \
            || { python -m src.fal_diag; exit 1; }

      - name: Generate
        env:
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          RODIN_API_KEY: ${{ secrets.RODIN_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          python -m src.cli generate \
            --only ${{ github.event.inputs.providers }} \
            --mode ${{ github.event.inputs.mode }} \
            --max-cases ${{ github.event.inputs.max_cases }} \
            --repeats ${{ github.event.inputs.repeats || '1' }}

      - name: Analyze
        run: python -m src.cli analyze

      - name: Semantic gallery (+ VLM judge when ARK_VLM_MODEL is set)
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          # accept the model id from either a repo Variable or a Secret
          ARK_VLM_MODEL: ${{ vars.ARK_VLM_MODEL || secrets.ARK_VLM_MODEL }}
        run: python -m src.cli semantic

      - name: Rig smoke test (Blender bind + bend)
        run: python -m src.cli rig

      - name: Slicer ground truth (PrusaSlicer --info + draft g-code)
        run: python -m src.cli slice

      - name: Blind set + report
        run: |
          python -m src.cli blind
          python -m src.cli report

      - name: Show report in the run log
        if: always()
        run: |
          if [ -f results/report.md ]; then
            echo "==================== REPORT ===================="
            cat results/report.md
            echo "==================== SCORES (per mesh) ===================="
            cat results/scores.json
            echo "==================== METRICS (raw geometry) ===================="
            cat results/metrics.json
            { echo "## Blind-test report"; cat results/report.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no report produced (check the Generate step)"
          fi

      - name: Upload results (meshes, metrics, scores, report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blindtest-results
          path: |
            results/
            cases/refs/
          if-no-files-found: warn
          retention-days: 14
