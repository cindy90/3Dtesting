# Run configuration. Model versions/endpoints are pinned here so a benchmark is
# reproducible and a re-run with a newer version is a one-line diff.
#
# `run_id` seeds the blind shuffle (keep it stable to reproduce a run).
run_id: 2026-07-blind-01

# Input mode:
#   text  — text-native models only (Tripo, Meshy). Prompt goes straight in.
#   image — fair mixed cohort: `refimg` mints one shared reference image per
#           case (FLUX) and EVERY model consumes that identical image. Required
#           for the open-source image-to-3D models. Override with `--mode`.
mode: text

# Shared reference-image generator (used only in image mode).
reference_images:
  model_id: fal-ai/flux/schnell
  dir: cases/refs
  image_size: square_hd

# Which providers to include. Comment a line out to skip that model.
# Open-source models need FAL_KEY and only work in image mode.
providers:
  # --- commercial APIs ---
  # Direct Tripo API — official latest families: v3.x / P1 / H3.1 (per
  # platform.tripo3d.ai docs). Confirmed version strings: v3.0-20250812,
  # P1-20260311. For H3.1 paste the exact string from the docs' model list.
  # Needs TRIPO_API_KEY credit (fal hosts only v2.5 + P1).
  tripo:     {model_version: "v3.0-20250812", texture: true, pbr: true}
  tripo_p1d: {model_version: "P1-20260311", texture: true}   # P1 官方直连 (图50 credits含贴图)
  # "H3.1" 是营销名(HD Model H3.1);API 的 model_version 用 "v3.1"
  # (官方请求示例即 model_version: "v3.1")。保留日期变体作自愈候选。
  tripo_h31:
    model_version: "v3.1"
    model_version_candidates: ["v3.1-20260326", "v3.1-20260319"]
    texture: true
  meshy:     {ai_model: "meshy-6", target_polycount: 30000}
  rodin:     {tier: "Regular", mesh_mode: "Quad", quality: "high"}   # 影眸/Deemos
  # Seed3D 2.0 (字节/火山方舟) — 模型ID由用户从方舟控制台确认;
  # 1.0 回退: doubao-seed3d-1-0-250928
  seed3d:    {model_id: "doubao-seed3d-2-0-260328", options: "--fileformat glb"}
  # --- hosted-on-fal commercial (shares FAL_KEY) ---
  rodin_fal: {model_id: "fal-ai/hyper3d/rodin/v2.5", quality: "medium", material: "PBR"}  # ~$0.4/gen
  # tripo_fal disabled: fal's tripo v2.5 endpoint downloads image_url server-side
  # and rejects data URIs (422 file_download_error). Tripo runs first-party now.
  # tripo_fal: {model_id: "tripo3d/tripo/v2.5/image-to-3d"}
  tripo_p1:  {model_id: "tripo3d/p1/image-to-3d"}           # P1.0 Smart Mesh (GDC 2026)
  # --- open-source cohort (fal.ai, image-to-3D) ---
  hunyuan3d:     {model_id: "fal-ai/hunyuan3d/v2"}
  hunyuan3d_v21: {model_id: "fal-ai/hunyuan3d-v21"}
  hunyuan3d_v31: {model_id: "fal-ai/hunyuan-3d/v3.1/pro/image-to-3d"}  # 腾讯最新旗舰 $0.375/gen
  trellis:       {model_id: "fal-ai/trellis"}
  trellis2:      {model_id: "fal-ai/trellis-2", params: {decimation_target: 30000}}
  triposr:       {model_id: "fal-ai/triposr", params: {mc_resolution: 256}}
  # instantmesh disabled: fal returns 404 "Application instant-mesh not found" —
  # the endpoint no longer exists on fal (third-party references were stale).
  # instantmesh: {model_id: "fal-ai/instant-mesh"}

# Where generated meshes, metrics, and reports are written.
out_dir: results

# Case set.
cases_file: cases/cases.yaml

# Polling budget per case (seconds). Big characters can take minutes.
timeout_s: 900
poll_interval_s: 6
