  # ---------------- hard-surface (9) ----------------
  - {id: h01, category: hardsurface, expect_symmetry: true, prompt: "a sci-fi laser rifle, side detail, hard-surface game asset"}
  - {id: h02, category: hardsurface, expect_symmetry: true, prompt: "a low-poly muscle car, clean body panels"}
  - {id: h03, category: hardsurface, expect_symmetry: true, prompt: "a quadcopter drone with four rotors and a camera gimbal"}
