# Blind-test input set — IDENTICAL across every model (protocol requirement).
#
# 40 text-to-3D cases, balanced so the production dimensions are all exercised:
#   character   -> riggability + symmetry are decisive (14)
#   prop        -> watertight small objects (9)
#   hardsurface -> topology on mechanical/vehicle/weapon forms (9)
#   organic     -> watertight blobby forms that tempt splat-style output (8)
#
# expect_symmetry gates the (expensive) bilateral-symmetry probe; set only for
# forms a rigger would expect to be left/right symmetric.
# Image-to-3D cases can be added with mode: image + image_path once you have a
# shared reference-image set; text keeps the input trivially shareable.

version: 1
cases:
  # ---------------- characters (14) ----------------
  - {id: c01, category: character, expect_symmetry: true, prompt: "a stylized cartoon knight in full plate armor, standing T-pose, game-ready character"}
  - {id: c02, category: character, expect_symmetry: true, prompt: "a humanoid robot android with segmented limbs, standing straight, arms at sides"}
  - {id: c03, category: character, expect_symmetry: true, prompt: "a chibi female mage with a pointed hat and staff, T-pose"}
  - {id: c04, category: character, expect_symmetry: true, prompt: "a bipedal cartoon fox character wearing a jacket, standing, arms spread"}
  - {id: c05, category: character, expect_symmetry: true, prompt: "a muscular orc warrior, bare chest, standing T-pose, low-poly game character"}
  - {id: c06, category: character, expect_symmetry: true, prompt: "a cute round penguin character with tiny wings, front facing, symmetric"}
  - {id: c07, category: character, expect_symmetry: true, prompt: "a sci-fi astronaut in a spacesuit, helmet on, standing straight"}
  - {id: c08, category: character, expect_symmetry: true, prompt: "a fantasy elf archer, slim, standing T-pose, wearing a hooded cloak"}
  - {id: c09, category: character, expect_symmetry: true, prompt: "a cartoon zombie in torn clothes, arms outstretched forward, standing"}
  - {id: c10, category: character, expect_symmetry: true, prompt: "a small dragon standing on two legs with folded wings, symmetric, front facing"}
  - {id: c11, category: character, expect_symmetry: true, prompt: "a wooden artist mannequin figure in neutral standing pose"}
  - {id: c12, category: character, expect_symmetry: true, prompt: "a superhero in a tight suit and cape, standing heroic T-pose"}
  - {id: c13, category: character, expect_symmetry: true, prompt: "a cartoon bee character with four arms folded, symmetric, standing"}
  - {id: c14, category: character, expect_symmetry: true, prompt: "a knight's suit of empty armor standing upright, T-pose, hollow"}

  # ---------------- props (9) ----------------
